name: Evaluate classifiers

on:
  workflow_dispatch:   # run by hand from the Actions tab

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compare keyword rules and AI against the reference labels
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m tracker.evaluate
      - name: Commit results
        run: |
          git config user.name "review-tracker-bot"
          git config user.email "review-tracker-bot@users.noreply.github.com"
          git add eval/results.md
          git diff --cached --quiet || git commit -m "Classifier evaluation $(date -u +%Y-%m-%d)"
          git push
