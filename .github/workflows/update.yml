name: Update reviews

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday, 03:17 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Collect, classify and build dashboard data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional; without it keyword rules are used
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}           # optional repository variable
        run: python -m tracker.run

      - name: Commit results
        run: |
          git config user.name "review-tracker-bot"
          git config user.email "review-tracker-bot@users.noreply.github.com"
          git add data docs/data.json SUMMARY.md
          git diff --cached --quiet || git commit -m "Weekly review update $(date -u +%Y-%m-%d)"
          git push
